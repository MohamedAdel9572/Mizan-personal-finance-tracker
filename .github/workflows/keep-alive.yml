name: Keep Supabase awake

# Copied from skn-clinic. Free Supabase projects pause after 7 days without activity.
# This makes one tiny call every 3 days so the database never sleeps.
# Set SUPABASE_URL and SUPABASE_KEY under GitHub → Settings → Secrets and variables → Actions → Variables.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_KEY repository variables are not set"; exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
                 -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered: $code"
          test "$code" = "200"
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
